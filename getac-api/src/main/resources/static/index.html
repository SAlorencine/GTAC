<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTAC - Análise Comparativa</title>
    
    <!-- Link para o Tailwind (Framework do Lovable) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Link para o SEU arquivo CSS separado -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#eaf4ec] min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Card Principal -->
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 max-w-4xl w-full">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-10">
            <div class="bg-green-100 w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800 mb-2">Upload de Arquivo</h1>
            <p class="text-slate-500">Envie duas planilhas para gerar a análise comparativa em PDF.</p>
        </div>

        <!-- Formulário -->
        <form id="uploadForm" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Coluna 1 -->
                <div>
                    <h2 class="text-lg font-semibold text-slate-700 mb-3">Mês de Referência</h2>
                    <div id="dropzone1" class="border-2 border-dashed border-green-200 rounded-2xl p-8 text-center cursor-pointer hover:bg-green-50 hover:border-green-400 transition-colors h-48 flex flex-col justify-center items-center" onclick="document.getElementById('file1').click()">
                        <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p id="labelFile1" class="text-slate-500 text-sm">Arraste e Solte a Planilha aqui<br>ou clique para selecionar</p>
                        <input type="file" id="file1" accept=".xlsx, .xls, .csv" class="hidden" onchange="updateFileName('file1', 'labelFile1')">
                    </div>
                    <select id="mes1" class="mt-4 w-full border border-gray-200 rounded-xl p-3 text-slate-600 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                        <option value="">Selecione o mês</option>
                        <option value="Janeiro">Janeiro</option><option value="Fevereiro">Fevereiro</option><option value="Março">Março</option>
                        <option value="Abril">Abril</option><option value="Maio">Maio</option><option value="Junho">Junho</option>
                        <option value="Julho">Julho</option><option value="Agosto">Agosto</option><option value="Setembro">Setembro</option>
                        <option value="Outubro">Outubro</option><option value="Novembro">Novembro</option><option value="Dezembro">Dezembro</option>
                    </select>
                </div>

                <!-- Coluna 2 -->
                <div>
                    <h2 class="text-lg font-semibold text-slate-700 mb-3">Mês a ser comparado</h2>
                    <div id="dropzone2" class="border-2 border-dashed border-green-200 rounded-2xl p-8 text-center cursor-pointer hover:bg-green-50 hover:border-green-400 transition-colors h-48 flex flex-col justify-center items-center" onclick="document.getElementById('file2').click()">
                        <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p id="labelFile2" class="text-slate-500 text-sm">Arraste e Solte a Planilha aqui<br>ou clique para selecionar</p>
                        <input type="file" id="file2" accept=".xlsx, .xls, .csv" class="hidden" onchange="updateFileName('file2', 'labelFile2')">
                    </div>
                    <select id="mes2" class="mt-4 w-full border border-gray-200 rounded-xl p-3 text-slate-600 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                        <option value="">Selecione o mês</option>
                        <option value="Janeiro">Janeiro</option><option value="Fevereiro">Fevereiro</option><option value="Março">Março</option>
                        <option value="Abril">Abril</option><option value="Maio">Maio</option><option value="Junho">Junho</option>
                        <option value="Julho">Julho</option><option value="Agosto">Agosto</option><option value="Setembro">Setembro</option>
                        <option value="Outubro">Outubro</option><option value="Novembro">Novembro</option><option value="Dezembro">Dezembro</option>
                    </select>
                </div>

            </div>

            <button type="submit" id="btnAnalisar" class="w-full bg-[#95d5b2] hover:bg-[#74c69d] text-white font-bold text-lg py-4 rounded-xl mt-6 transition-colors shadow-sm flex justify-center items-center">
                <span>Analisar</span>
            </button>
        </form>
    </div>

    <!-- O JavaScript continua igual, processando o envio para o /api/gtac/analisar -->
    <script>
        function updateFileName(inputId, labelId) {
            const input = document.getElementById(inputId);
            const label = document.getElementById(labelId);
            if (input.files && input.files[0]) {
                label.innerHTML = `<span class="font-bold text-green-600">${input.files[0].name}</span>`;
            } else {
                label.innerHTML = "Arraste e Solte a Planilha aqui<br>ou clique para selecionar";
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            const mes1 = document.getElementById('mes1').value;
            const mes2 = document.getElementById('mes2').value;

            if (!file1 || !file2 || !mes1 || !mes2) {
                alert("Por favor, preencha todos os campos e selecione os dois arquivos.");
                return;
            }

            const btn = document.getElementById('btnAnalisar');
            const btnOriginalText = btn.innerHTML;
            btn.innerHTML = `<div class="border-4 border-white border-solid rounded-full w-6 h-6 loader mr-2"></div> Processando...`;
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            const formData = new FormData();
            formData.append("arquivoMes1", file1);
            formData.append("arquivoMes2", file2);
            formData.append("nomeMes1", mes1);
            formData.append("nomeMes2", mes2);

            try {
                const resposta = await fetch("/api/gtac/analisar", {
                    method: "POST",
                    body: formData,
                });

                if (!resposta.ok) {
                    throw new Error("Erro no servidor: " + resposta.status);
                }

                const blob = await resposta.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Relatorio_${mes1}_vs_${mes2}.pdf`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.URL.revokeObjectURL(url);

            } catch (erro) {
                console.error(erro);
                alert("Falha na comunicação. O Java está rodando?");
            } finally {
                btn.innerHTML = btnOriginalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
